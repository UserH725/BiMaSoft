<style>

         background: linear-gradient(135deg, #ff2d95, #ff9500, #ffe600, #2dff7a, #00c8ff, #7a3dff, #ff2d95); background-size: 400% 400%;

  <div id="now">

    <div id="nowSt" class="off" role="status" aria-live="polite"><span class="led"></span><span id="nowTx">in attesa</span></div>
  </div>
  <input id="vol" type="range" min="0" max="100" value="80" aria-label="Volume">

<main>

    <h1>Radio</h1><span id="count"></span>

  var au = document.getElementById('au'), btn = document.getElementById('btn'), vol = document.getElementById('vol');

  var cur = -1, cands = [], uIdx = 0, tries = 0, gen = 0, wantPlay = false, retryT = null, stalledT = null, hls = null, hlsLoading = null, items = [];

  function store(k, v) { try { localStorage.setItem(k, v); } catch (e) {} }
  function load(k) { try { return localStorage.getItem(k); } catch (e) { return null; } }

  // Su una pagina https il browser blocca gli stream http: si prova la versione https (gli indirizzi IP numerici si saltano, il certificato non combacerebbe)
  function candidates(st) {
    var out = [], secure = location.protocol === 'https:';
    st.urls.forEach(function (u) {
      if (secure && /^http:\/\//i.test(u)) {
        if (/^http:\/\/\d+\.\d+\.\d+\.\d+/i.test(u)) return;
        u = u.replace(/^http:/i, 'https:');

      if (out.indexOf(u) < 0) out.push(u);
    });

  }

  function teardown() {

  function loadHls(cb) {
    if (window.Hls) { cb(true); return; }
    if (hlsLoading) { hlsLoading.push(cb); return; }

  function updateNow() {

    var ac = window.AbortController ? new AbortController() : null, to = setTimeout(function () { if (ac) ac.abort(); }, 6000);
    return fetch(secure(u), { cache: 'no-store', signal: ac ? ac.signal : undefined }).then(function (r) {
      if (!r.ok) throw new Error('HTTP ' + r.status);
      return r.text();
    }).then(function (x) { clearTimeout(to); return x; }, function (e) { clearTimeout(to); throw e; });
  }
  function S(v) { return (typeof v === 'string' && v.trim()) ? v.trim() : ''; }
  function artTitle(a, t) { a = S(a); t = S(t); return (a && t) ? a + ' - ' + t : t; }

  // Pagina "now playing" della radio (campo info) o API AzuraCast: JSON con il titolo in uno dei campi piu' comuni, oppure testo semplice
  function parseInfo(txt) {
    txt = String(txt || '').trim();
    var j, k, keys, v, r, az, p;
    if (txt.charAt(0) !== '{' && txt.charAt(0) !== '[') return cleanSong(txt.split(/\r?\n/)[0]);
    j = JSON.parse(txt);
    if (Array.isArray(j)) j = j[0];
    if (!j || typeof j !== 'object') return '';
    // Formato Mediaset (RMC): il campo raw e' ARTISTA~BRANO~album~anno~...
    if (typeof j.raw === 'string' && j.raw.indexOf('~') >= 0) {
      p = j.raw.split('~');
      if (S(p[0]) && S(p[1])) return cleanSong(S(p[0]) + ' - ' + S(p[1]));
      if (S(p[0])) return cleanSong(S(p[0]));
    }
    keys = ['nowplaying', 'now_playing', 'nowPlaying', 'songtitle', 'song', 'title', 'current_song', 'currentSong', 'currenttrack', 'track'];
    for (k = 0; k < keys.length; k++) { v = S(j[keys[k]]); if (v) return cleanSong(v); }
    // Formato con involucro (xdevel): {"result":{"meta":"ARTISTA - Titolo","artist":..,"title":..}}; instant.audio (RDS): lista, in onda = track_played piu' alto
    r = j.result;
    if (Array.isArray(r) && r.length && r[0] && r[0].track_played !== undefined) {
      r = r.slice().sort(function (a, b) { return Number(b.track_played) - Number(a.track_played); })[0];
    }
    if (Array.isArray(r)) r = r[0];
    if (r && typeof r === 'object') {
      v = artTitle(r.track_artist, r.track_title); if (v) return cleanSong(v);
      v = S(r.meta); if (v) return cleanSong(v);
      v = artTitle(r.artist, r.title); if (v) return cleanSong(v);
    }
    az = j.now_playing && j.now_playing.song;   // AzuraCast
    if (az) { v = S(az.text) || artTitle(az.artist, az.title); if (v) return cleanSong(v); }
    return cleanSong(artTitle(j.artist, j.title));
  }
  // Pagine di stato dei server: Icecast (status-json.xsl), Shoutcast v2 (stats) e v1 (7.html)
  function parseStatus(kind, txt) {
    var j, src, arr, pick = null, i, ti, ar, f7;
    if (kind === 'ice') {
      j = JSON.parse(txt); src = j.icestats && j.icestats.source;
      arr = Array.isArray(src) ? src : (src ? [src] : []);
      for (i = 0; i < arr.length; i++) { if (/\/stream$/.test(String(arr[i].listenurl || '').split('?')[0])) { pick = arr[i]; break; } }
      if (!pick) pick = arr[0];
      if (!pick) return '';
      ti = String(pick.title || ''); ar = String(pick.artist || '');
      return cleanSong(ar && ti && ti.toLowerCase().indexOf(ar.toLowerCase()) < 0 ? ar + ' - ' + ti : ti);
    }
    if (kind === 'sc2') return cleanSong(JSON.parse(txt).songtitle);
    f7 = txt.replace(/<[^>]*>/g, '').trim().split(',');
    return f7.length > 6 ? cleanSong(f7.slice(6).join(',')) : '';
  }
  // Metadati dentro lo stream (ICY): serve un server che ammetta l'intestazione Icy-MetaData e la esponga; si legge un solo blocco e si chiude
  function icyTitle(url) {
    return new Promise(function (resolve, reject) {
      var ac = new AbortController(), done = false, to = setTimeout(function () { fin(null, new Error('timeout')); }, 8000);
      function fin(v, err) { if (done) return; done = true; clearTimeout(to); try { ac.abort(); } catch (e) {} if (err) reject(err); else resolve(v); }
      fetch(secure(url), { headers: { 'Icy-MetaData': '1' }, cache: 'no-store', signal: ac.signal }).then(function (r) {
        var mi = parseInt(r.headers.get('icy-metaint'), 10);
        if (!r.ok || !r.body || !(mi > 0 && mi <= 65536)) throw new Error('no icy');
        var rd = r.body.getReader(), acc = new Uint8Array(0);
        (function pump() {
          rd.read().then(function (x) {
            if (x.done) { fin(null, new Error('end')); return; }
            var c = new Uint8Array(acc.length + x.value.length); c.set(acc); c.set(x.value, acc.length); acc = c;
            if (acc.length > mi) {
              var L = acc[mi] * 16;
              if (L === 0) { fin(null); return; }   // blocco vuoto: titolo invariato
              if (acc.length >= mi + 1 + L) {
                var b = acc.subarray(mi + 1, mi + 1 + L), tx = new TextDecoder('utf-8').decode(b), mm;
                if (tx.indexOf('\uFFFD') >= 0) tx = new TextDecoder('windows-1252').decode(b);
                mm = /StreamTitle='(.*?)';/.exec(tx);
                fin(mm ? cleanSong(mm[1]) : '');
                return;
              }
            }
            pump();
          }, function (e) { fin(null, e); });
        })();
      }).catch(function (e) { fin(null, e); });
    });
  }

  function setSong(s) {
    if (s === song) return;
    song = s; updateNow(); setMedia();
  }
  function pollSong() {
    if (!wantPlay || nowSt.className !== 'on' || cur < 0 || polling) return;
    var st = STATIONS[cur], u = cands[uIdx] || '', g = gen, om = u.match(/^(https?:\/\/[^\/]+)/i), o = om ? om[1] : '', key = o + '|' + cur, tasks = [], m;
    if (meta.o !== key) meta = { o: key, kind: '', fails: 0, t: 0 };
    if (st.info) tasks.push({ k: 'info', f: function () { return fetchText(st.info).then(parseInfo); } });
    if (o && !/\.m3u8(\?|$)/i.test(u)) {
      m = u.match(/^(https?:\/\/[^\/]+)\/listen\/([^\/?#]+)\//i);
      if (m) tasks.push({ k: 'azura', f: function () { return fetchText(m[1] + '/api/nowplaying/' + m[2]).then(parseInfo); } });
      tasks.push({ k: 'ice', f: function () { return fetchText(o + '/status-json.xsl').then(function (x) { return parseStatus('ice', x); }); } });
      tasks.push({ k: 'sc2', f: function () { return fetchText(o + '/stats?sid=1&json=1').then(function (x) { return parseStatus('sc2', x); }); } });
      tasks.push({ k: 'sc1', f: function () { return fetchText(o + '/7.html').then(function (x) { return parseStatus('sc1', x); }); } });
      tasks.push({ k: 'icy', f: function () { return icyTitle(u); } });
    }
    if (meta.kind) tasks = tasks.filter(function (x) { return x.k === meta.kind; });
    else if (meta.fails >= 3 && Date.now() - meta.t < 60000) return;   // nessun metodo ha funzionato: si riprova solo ogni minuto
    if (!tasks.length) return;
    polling = true;
    (function run(i) {
      if (i >= tasks.length) { meta.kind = ''; meta.fails++; meta.t = Date.now(); polling = false; return; }
      tasks[i].f().then(function (s) {
        polling = false;
        if (g !== gen) return;
        meta.kind = tasks[i].k; meta.fails = 0;
        if (s !== null && s !== undefined) setSong(s);
      }, function () { run(i + 1); });
    })(0);
  }
  au.addEventListener('playing', function () { setTimeout(function () { lastPoll = Date.now(); pollSong(); }, 1500); });
  // Radio con pagina dedicata: titolo riletto ogni 3 s; le altre ogni 10 s (ICY ogni 20 s)
  setInterval(function () {
    var st = cur >= 0 ? STATIONS[cur] : null, gap = (st && st.info) || meta.kind === 'info' ? 3000 : (meta.kind === 'icy' ? 20000 : 10000);
    if (Date.now() - lastPoll >= gap) { lastPoll = Date.now(); pollSong(); }
  }, 1000);

  // Elenco e ricerca
  STATIONS.forEach(function (s, i) {
    var li = document.createElement('li'), b = document.createElement('button');
    b.type = 'button'; b.className = 'st'; b.setAttribute('aria-pressed', 'false');
    b.innerHTML = '<span class="ic" aria-hidden="true">&#9654;</span><span class="eq" aria-hidden="true"><i></i><i></i><i></i></span><span class="nm"></span>';
    b.querySelector('.nm').textContent = s.name;
    b.addEventListener('click', function () { select(i, true); });
    li.appendChild(b); li.setAttribute('data-n', s.name.toLowerCase());
    listEl.appendChild(li); items.push(b);
  });
  document.getElementById('count').textContent = STATIONS.length + ' stazioni';
  document.getElementById('find').addEventListener('input', function () {
    var q = this.value.trim().toLowerCase(), shown = 0;
    Array.prototype.forEach.call(listEl.children, function (li) {
      var ok = !q || li.getAttribute('data-n').indexOf(q) >= 0;
      li.hidden = !ok; if (ok) shown++;
    });
    document.getElementById('none').hidden = shown > 0;
  });

  var v = parseInt(load('radioVol'), 10);
  if (!isNaN(v) && v >= 0 && v <= 100) vol.value = v;
  au.volume = vol.value / 100;
  var last = load('radioLast'), li0 = -1;
  STATIONS.forEach(function (s, i) { if (s.name === last) li0 = i; });
  if (li0 >= 0) select(li0, false); else { render(); updateNow(); }

  // Sfondo animato: note musicali colorate che salgono, in numero proporzionale alla larghezza
  (function () {
    var box = document.getElementById('notes'), rsT = null;
    var COL = ['#ff2d95', '#ff9500', '#ffe600', '#2dff7a', '#00c8ff', '#7a3dff'], GLY = ['\u266A', '\u266B', '\u266C', '\u2669'];
    function rnd(a, b) { return a + Math.random() * (b - a); }
    function build() {
      var n = Math.max(20, Math.min(90, Math.round(box.clientWidth / 26))), i, d, h = [];
      for (i = 0; i < n; i++) {
        d = rnd(2.4, 4.2);
        h.push('<span class="rn" style="left:' + rnd(1, 97).toFixed(1) + '%;font-size:' + Math.round(rnd(15, 24)) + 'px;color:' + COL[Math.floor(Math.random() * COL.length)] + ';animation-duration:' + d.toFixed(2) + 's;animation-delay:-' + rnd(0, d).toFixed(2) + 's">' + GLY[Math.floor(Math.random() * GLY.length)] + '</span>');
      }
      box.innerHTML = h.join('');
    }
    build();
    window.addEventListener('resize', function () { clearTimeout(rsT); rsT = setTimeout(build, 300); });
  })();
</script>
</body>
