  @import url('https://fonts.googleapis.com/css2?family=Cabin:ital,wght@0,700;1,700&display=swap');
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: #000; color: #e8e8e8; font-family: "Segoe UI", system-ui, -apple-system, Roboto, Arial, sans-serif; font-size: 15px; }
  button, input { font: inherit; color: inherit; }
  :focus-visible { outline: 2px solid #4fb3ff; outline-offset: 2px; }

  #hdr { position: sticky; top: 0; z-index: 10; background: #000; border-bottom: 1px solid rgba(255,255,255,.12); }
  #player { position: relative; z-index: 0; display: flex; align-items: center; gap: 12px; height: 70px; padding: 0 16px; padding-top: env(safe-area-inset-top, 0px); background: #000; border-bottom: 1px solid rgba(255,255,255,.12); overflow: hidden; }
  
  #notes { position: fixed; inset: 0; z-index: 0; overflow: hidden; pointer-events: none; display: flex; align-items: center; justify-content: center; }
  #bgDisc {
    position: absolute; width: min(85vw, 85vh); height: min(85vw, 85vh); border-radius: 50%; opacity: 0.40; filter: blur(0px);
    animation: discSpin 10s linear infinite; animation-play-state: paused;
    background:
      radial-gradient(circle at 50% 33%, rgba(255,255,255,.95) 0 1.6px, transparent 2.2px),
      radial-gradient(circle at center, #ff7ac0 0, #ff2d95 11px, #fff 11.5px 12.5px, transparent 13px),
      conic-gradient(from 20deg, transparent 0 4%, rgba(0,200,255,.32) 10%, rgba(255,255,255,.38) 14%, rgba(255,45,149,.3) 18%, transparent 26%, transparent 50%, rgba(0,200,255,.32) 60%, rgba(255,255,255,.38) 64%, rgba(255,45,149,.3) 68%, transparent 76%),
      repeating-radial-gradient(circle at center, #0b0b0b 0 2px, #1c1c1c 2px 3px);
  }

  body.is-playing #bgDisc { animation-play-state: running; }

  #notes .rn { 
    position: absolute; top: 100%; line-height: 1; opacity: 0; will-change: transform, opacity; 
    animation-name: rnUp; animation-timing-function: ease-out; animation-iteration-count: infinite; animation-play-state: paused;
  }
  body.is-playing #notes .rn { animation-play-state: running; }

  main { position: relative; z-index: 1; }
  @keyframes rnUp { 0% { transform: translateY(0) rotate(-12deg); opacity: 0; } 8% { opacity: .5; } 85% { opacity: .5; } 100% { transform: translateY(calc(-100vh - 60px)) rotate(14deg); opacity: 0; } }

  #now { flex: 1 1 auto; min-width: 0; text-shadow: 0 1px 3px #000, 0 0 8px #000; }
  #nowRadio {   font-family: 'Cabin', sans-serif;   font-style: italic;   font-weight: 700;   font-size: 17px;   line-height: 1.15;   color: #ffe600;   white-space: nowrap;   overflow: hidden; }
  #nowRadio span, #ovName span, #ovSong span { display: inline-block; }
  #nowRadio.mq span, #ovName.mq span, #ovSong.mq span { animation: mq var(--t, 8s) ease-in-out infinite alternate; }
  #nowName { font-family: 'Source Sans 3', 'Segoe UI', system-ui, Roboto, Arial, sans-serif; font-size: 15px; font-weight: 600; line-height: 1.2; min-height: 1.2em; white-space: nowrap; overflow: hidden; }
  #nowName span { display: inline-block; }
  #nowName.mq span { animation: mq var(--t, 8s) ease-in-out infinite alternate; }
  @keyframes mq { 0%, 12% { transform: translateX(0); } 88%, 100% { transform: translateX(calc(-1 * var(--d, 0px))); } }

  var ovEl = document.getElementById('ov'), ovCard = ovEl.querySelector('.ovc'), ovSongTx = document.getElementById('ovSongTx'), ovName = document.getElementById('ovName'), ovNameTx = document.getElementById('ovNameTx');
  var ovBadge = document.getElementById('ovBadge'), ovBadgeTx = document.getElementById('ovBadgeTx'), ovSong = document.getElementById('ovSong'), hdrEl = document.getElementById('hdr'), ovOpen = false, ovT = null, ovAt = 0;
  function ovTarget() {
    var hb = hdrEl.getBoundingClientRect().bottom, vw = window.innerWidth, vh = window.innerHeight, w = Math.min(vw - 24, 560), h = Math.max(200, Math.min(vh - hb - 24, 340));
    ovEl.style.setProperty('--hh', hb + 'px');
    return { top: hb + (vh - hb - h) / 2, left: (vw - w) / 2, width: w, height: h };
  }
  function ovPlace(r) { ovCard.style.top = r.top + 'px'; ovCard.style.left = r.left + 'px'; ovCard.style.width = r.width + 'px'; ovCard.style.height = r.height + 'px'; }
  function ovNoAnim(fn) { ovCard.style.transition = 'none'; fn(); void ovCard.offsetWidth; ovCard.style.transition = ''; }
  /* altezza dell'intestazione fissa -> posizione della barra di ricerca sticky */
  (function () {
    var root = document.documentElement;
    function setH() { root.style.setProperty('--hdrh', Math.round(hdrEl.getBoundingClientRect().height) + 'px'); }
    setH(); window.addEventListener('resize', setH);
    if (window.ResizeObserver) new ResizeObserver(setH).observe(hdrEl);
  })();
  var ovShown = {};
  function ovSet(el, key, text, force, done) {
    if (!force && ovShown[key] === text) return;
    ovShown[key] = text; scramble(el, text, done);
  }
  function ovFill(force) {
    var bs = nowSt.classList.contains('on') ? 'on' : nowSt.classList.contains('buf') ? 'buf' : 'off';
    ovBadge.setAttribute('data-s', bs);
    ovBadgeTx.textContent = bs === 'on' ? 'ON AIR' : bs === 'buf' ? 'BUFFER' : 'OFF';
    var nm = cur >= 0 ? STATIONS[cur].name : '';
    if (force || ovShown.n !== nm) ovName.classList.remove('mq');
    ovSet(ovNameTx, 'n', nm, force, function () { fitMq(ovName, ovNameTx); });
    var sg = song ? '\u266A ' + song : '';
    if (force || ovShown.g !== sg) ovSong.classList.remove('mq');
    ovSet(ovSongTx, 'g', sg, force, function () { fitMq(ovSong, ovSongTx); });
  }
  function ovRect(row, t) {
    var r = row ? row.getBoundingClientRect() : null, hb = hdrEl.getBoundingClientRect().bottom;
    if (r && r.width > 0 && r.height > 0 && r.bottom > hb && r.top < window.innerHeight) return { top: r.top, left: r.left, width: r.width, height: r.height };
    return { top: t.top + t.height / 2, left: t.left + t.width / 2, width: 0, height: 0 };
  }
  function ovShow(i) {
    var t;
    clearTimeout(ovT);
    ovFill(true); t = ovTarget();
    ovEl.hidden = false; ovEl.classList.remove('open');
    ovNoAnim(function () { ovPlace(ovRect(items[i], t)); });
    ovOpen = true; ovAt = Date.now();
    ovEl.classList.add('open');
    ovPlace(t);
    try { ovCard.focus({ preventScroll: true }); } catch (e) {}
  }
  function ovHide() {
    if (!ovOpen || Date.now() - ovAt < 350) return;
    var row = cur >= 0 ? items[cur] : null;
    ovOpen = false;
    ovEl.classList.remove('open');
    ovPlace(ovRect(row, ovTarget()));
    clearTimeout(ovT);
    ovT = setTimeout(function () { ovEl.hidden = true; }, 420);
    if (row) { try { row.focus({ preventScroll: true }); } catch (e) {} }
  }
  ovCard.addEventListener('transitionend', function (e) { if (ovOpen && e.propertyName === 'width') { fitMq(ovName, ovNameTx); fitMq(ovSong, ovSongTx); } });
  ovEl.addEventListener('click', ovHide);
  ovEl.addEventListener('touchmove', function (e) { e.preventDefault(); }, { passive: false });
  ovEl.addEventListener('wheel', function (e) { e.preventDefault(); }, { passive: false });
  ovCard.addEventListener('keydown', function (e) { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); ovHide(); } });
  document.addEventListener('keydown', function (e) { if (ovOpen && e.key === 'Escape') ovHide(); });
  window.addEventListener('resize', function () { if (ovOpen) ovNoAnim(function () { ovPlace(ovTarget()); }); });

  au.volume = 1;
  var last = load('radioLast'), li0 = -1;
  STATIONS.forEach(function (s, i) { if (s.name === last) li0 = i; });
  if (li0 >= 0) select(li0, false); else { render(); updateNow(); }

  (function () {
    var box = document.getElementById('notes'), rsT = null;
    var COL = ['#ff2d95', '#ff9500', '#ffe600', '#2dff7a', '#00c8ff', '#7a3dff'], GLY = ['\u266A', '\u266B', '\u266C', '\u2669'];
    function rnd(a, b) { return a + Math.random() * (b - a); }
    function build() {
      var bgD = document.getElementById('bgDisc');
      var n = Math.max(60, Math.min(160, Math.round(box.clientWidth * box.clientHeight / 6000))), i, d, h = [];
      for (i = 0; i < n; i++) {
        d = rnd(9, 18);
        h.push('<span class="rn" style="left:' + rnd(1, 97).toFixed(1) + '%;font-size:' + Math.round(rnd(15, 24)) + 'px;color:' + COL[Math.floor(Math.random() * COL.length)] + ';animation-duration:' + d.toFixed(2) + 's;animation-delay:-' + rnd(0, d).toFixed(2) + 's">' + GLY[Math.floor(Math.random() * GLY.length)] + '</span>');
      }
      box.innerHTML = h.join('');
      if (bgD) box.appendChild(bgD);
    }
    build();
    window.addEventListener('resize', function () { clearTimeout(rsT); rsT = setTimeout(build, 300); });
  })();

  // --- MOTORINO JS PER CAMBIO GRADIENTI AUTOMATICO RIPRISTINATO ---
  (function () {
    var de = document.documentElement, pl = document.getElementById('player');
    var curGrad = 1, tm = null, doneT = null, PERIOD = 60000, since = Date.now();
    function setG(g) { pl.setAttribute('data-g', g); de.setAttribute('data-g', g); since = Date.now(); }
    function clearOld() { pl.removeAttribute('data-go'); de.removeAttribute('data-go'); }
    function set(g, instant) {
      var old = curGrad;
      curGrad = g; store('radioGrad', g);
      clearTimeout(doneT);
      if (instant) { clearOld(); setG(g); return; }
      /* dissolvenza incrociata: il vecchio gradiente resta visibile (strato ::after) mentre il nuovo (::before) sale da 0 a 1 */
      de.style.setProperty('--od', '-' + ((Date.now() - since) / 1000).toFixed(2) + 's');
      pl.setAttribute('data-go', old); de.setAttribute('data-go', old);
      pl.classList.add('fo'); de.classList.add('fo');
      setG(g);
      void de.offsetWidth;
      pl.classList.remove('fo'); de.classList.remove('fo');
      doneT = setTimeout(clearOld, 1000);
    }
    var sv = parseInt(load('radioGrad'), 10);
    set(isNaN(sv) || sv < 1 || sv > 9 ? 1 : sv, true);
    tm = setInterval(function () { set(curGrad >= 9 || curGrad < 1 ? 1 : curGrad + 1); }, PERIOD);
  })();

  (function () {
    var T = INIT_BUFFER_TARGET, FULL = 5, box = document.getElementById('bufrow'), bf = document.getElementById('bfill'), bt = document.getElementById('bftxt');
    var lastBufferedSec = 0;

    function upd() {
      if (!(wantPlay && cur >= 0)) { bf.style.clipPath = 'inset(0 100% 0 0)'; bt.textContent = ''; box.title = ''; lastBufferedSec = 0; return; }
      var r = au.buffered, t = au.currentTime, s = 0, k, lv, kbps, kb, p, f, sz;
      for (k = 0; k < r.length; k++) { if (t >= r.start(k) - 0.3 && t <= r.end(k) + 0.3) { s = Math.max(0, r.end(k) - t); break; } }
      
      if (!hls && s > lastBufferedSec) {
        var diffSec = s - lastBufferedSec;
        addDownloadedBytes(diffSec * (128 * 1024 / 8));
      }
      lastBufferedSec = s;

      lv = hls && hls.levels && hls.levels[hls.currentLevel >= 0 ? hls.currentLevel : 0];
      kbps = lv && lv.bitrate ? lv.bitrate / 1000 : 128;
      kb = s * kbps / 8; p = Math.min(100, Math.round(s / T * 100)); f = Math.min(1, (s / T * 100) / FULL);
      sz = '~' + (kb >= 1024 ? (kb / 1024).toFixed(1).replace('.', ',') + ' MB' : Math.round(kb) + ' KB');
      bf.style.clipPath = 'inset(0 ' + ((1 - f) * 100).toFixed(1) + '% 0 0)';
      bt.textContent = 'Buffer ' + p + '% \u00B7 ' + sz + ' \u00B7 ' + Math.round(s) + ' s';
      box.title = 'Buffer: ' + s.toFixed(1).replace('.', ',') + ' s in coda su ' + T + ' s target \u00B7 dimensione stimata a ' + Math.round(kbps) + ' kbps';
    }
    au.addEventListener('playing', upd); au.addEventListener('waiting', upd); au.addEventListener('progress', upd);
    setInterval(upd, 500);
  })();

  (function () {
    var doneGen = -1;
    var initWrap = document.getElementById('initBufWrap');
    var ovInitWrap = document.getElementById('ovInitBufWrap');

    function ahead() {
      var r = au.buffered, t = au.currentTime, k;
      for (k = 0; k < r.length; k++) { 
        if (t >= r.start(k) - 0.3 && t <= r.end(k) + 0.3) return Math.max(0, r.end(k) - t); 
      }
      return 0;
    }
    
    function setBufBar(pct) {
      var hue = Math.round((pct / 100) * 140);
      var lightness = Math.round(50 - (pct / 100) * 20);
      var dynamicColor = 'hsl(' + hue + ', 100%, ' + lightness + '%)';

      if (initBufBar) {
        initBufBar.style.width = pct + '%';
        initBufBar.style.backgroundColor = dynamicColor;
      }
      if (ovInitBufBar) {
        ovInitBufBar.style.width = pct + '%';
        ovInitBufBar.style.backgroundColor = dynamicColor;
      }
    }

    function showBar(visible) {
      if (visible) {
        nowSt.classList.add('buf-loading');
        if (initWrap) initWrap.style.display = 'block';
        if (ovInitWrap) ovInitWrap.style.display = 'block';
      } else {
        nowSt.classList.remove('buf-loading');
        if (initWrap) initWrap.style.display = 'none';
        if (ovInitWrap) ovInitWrap.style.display = 'none';
      }
    }

    au.addEventListener('playing', function () {
      if (doneGen === gen) return;
      doneGen = gen;
      
      var need = INIT_BUFFER_TARGET;
      if (hls || ahead() >= need) {
        showBar(false);
        return;
      }
      
      var g = gen;
      var currentPct = 0;
      var startTime = Date.now();
      
      bufHold = true;
      au.pause();
      showBar(true);
      setBufBar(0);
      
      (function w() {
        if (g !== gen || !wantPlay) {
          bufHold = false;
          showBar(false);
          return;
        }
        
        var a = ahead();
        var elapsed = Date.now() - startTime;
        var targetPct = Math.min(100, Math.round((a / need) * 100));
        
        if (currentPct < targetPct) {
          currentPct = Math.min(targetPct, currentPct + 3);
        } else if (elapsed > 500 && currentPct < 95) {
          currentPct += 1;
        }
        
        setBufBar(currentPct);
        
        if (a >= need || currentPct >= 100 || (elapsed > 2500 && a >= 1)) { 
          setBufBar(100);
          setTimeout(function() {
            bufHold = false;
            if (g === gen) {
              showBar(false);
              au.play().catch(onPlayErr(g)); 
            }
          }, 120);
          return; 
        }

        setSt('buf', 'caricamento buffer...');
        showBar(true);

        setTimeout(w, 40);
      })();
    });
  })();

  /* --- RILEVAMENTO CONNESSIONE REALE + RIPARTENZA AUTOMATICA --- */
  var netOk = null, netProbeT = null, netBusy = false, netWake = false, bootAuto = false;
  var netCon = document.getElementById('netCon'), netLbl = document.getElementById('netLbl');
  var NET_URL = 'https://www.gstatic.com/generate_204';

  function isPlayingNow() { return nowSt.className === 'on' && !au.paused && au.readyState >= 3; }

  function netBack(first) {
    if (cur < 0 || isPlayingNow()) return;
    if (first ? bootAuto : (userWants || wantPlay)) { tries = 0; clearTimeout(retryT); select(cur, true); }
  }

  function netSet(ok, wake) {
    var was = netOk; netOk = ok;
    netCon.className = ok ? 'ok' : 'ko';
    netLbl.textContent = ok ? 'connessione OK' : 'connessione KO';
    if (ok && (was !== true || wake)) netBack(was === null);
    if (!ok && was !== false && wantPlay) setSt('buf', 'senza rete, attendo...');
  }

  function netProbe(wake) {
    if (wake) netWake = true;
    if (netBusy) return;
    clearTimeout(netProbeT);
    netBusy = true;
    var done = false, ctl = ('AbortController' in window) ? new AbortController() : null;
    var to = setTimeout(function () { finish(false); if (ctl) { try { ctl.abort(); } catch (e) {} } }, 5000);
    function finish(ok) {
      if (done) return; done = true; clearTimeout(to); netBusy = false;
      var w = netWake; netWake = false;
      netSet(ok, w);
      netProbeT = setTimeout(netProbe, ok ? 15000 : 4000);
    }
    if (navigator.onLine === false) { finish(false); return; }
    try {
      fetch(NET_URL + '?_=' + Date.now(), { mode: 'no-cors', cache: 'no-store', signal: ctl ? ctl.signal : undefined })
        .then(function () { finish(true); }, function () { finish(false); });
    } catch (e) { finish(false); }
  }

  window.addEventListener('online', function () { netProbe(true); });
  window.addEventListener('offline', function () { netSet(false, false); });
  window.addEventListener('pageshow', function () { netProbe(true); });
  document.addEventListener('visibilitychange', function () { if (!document.hidden) netProbe(true); });

  bootAuto = cur >= 0;
  netProbe(false);

  (function () {
    var ck = document.getElementById('ck'), cd = document.getElementById('cd');
    var tf = new Intl.DateTimeFormat('it-IT', { hour: '2-digit', minute: '2-digit', second: '2-digit' });
    var df = new Intl.DateTimeFormat('it-IT', { weekday: 'long', day: 'numeric', month: 'long', year: 'numeric' });
    var slots = [], reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    function build(str) {
      var i, ch, el, sp;
      ck.textContent = ''; slots = [];
      for (i = 0; i < str.length; i++) {
        ch = str.charAt(i);
        if (/[0-9]/.test(ch)) {
          el = document.createElement('span'); el.className = 'dg'; el.setAttribute('aria-hidden', 'true');
          sp = document.createElement('span'); sp.textContent = ch; el.appendChild(sp);
          ck.appendChild(el); slots.push({ el: el, v: ch });
        } else {
          el = document.createElement('span'); el.textContent = ch; el.setAttribute('aria-hidden', 'true'); ck.appendChild(el); slots.push(null);
        }
      }
    }
    function roll(s, ch) {
      var old = s.el.lastElementChild, nw = document.createElement('span'), o = { duration: 380, easing: 'cubic-bezier(.3,.9,.3,1)', fill: 'forwards' };
      s.v = ch; nw.textContent = ch; s.el.appendChild(nw);
      if (reduce || !nw.animate) { s.el.removeChild(old); return; }
      nw.animate([{ transform: 'translateY(100%)' }, { transform: 'translateY(0)' }], o);
      old.animate([{ transform: 'translateY(0)' }, { transform: 'translateY(-100%)' }], o).onfinish = function () { if (old.parentNode) old.parentNode.removeChild(old); };
    }
    function setTime(str) {
      var i;
      if (slots.length !== str.length) build(str);
      else for (i = 0; i < str.length; i++) if (slots[i] && slots[i].v !== str.charAt(i)) roll(slots[i], str.charAt(i));
      ck.setAttribute('aria-label', str);
    }
    function tick() { var d = new Date(); setTime(tf.format(d)); cd.textContent = df.format(d); }
    tick(); setInterval(tick, 1000);
  })();

  (function () {
    var NS = 'http://www.w3.org/2000/svg', g = document.getElementById('anaDots'), i, a, c;
    var hh = document.getElementById('anaH'), hm = document.getElementById('anaM'), hs = document.getElementById('anaS');
    var reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    for (i = 0; i < 12; i++) {
      a = i * Math.PI / 6; c = document.createElementNS(NS, 'circle');
      c.setAttribute('cx', 50 + 38 * Math.sin(a)); c.setAttribute('cy', 50 - 38 * Math.cos(a));
      c.setAttribute('r', i % 3 ? 2.6 : 3.8); c.setAttribute('fill', 'hsl(' + ((i * 30 + 330) % 360) + ',95%,60%)');
      g.appendChild(c);
    }
    function rot(e, d) { e.setAttribute('transform', 'rotate(' + d + ' 50 50)'); }
    function frame() {
      var d = new Date(), s = d.getSeconds() + (reduce ? 0 : d.getMilliseconds() / 1000), m = d.getMinutes() + s / 60, h = d.getHours() % 12 + m / 60;
      rot(hh, h * 30); rot(hm, m * 6); rot(hs, s * 6);
      if (reduce) setTimeout(frame, 1000); else requestAnimationFrame(frame);
    }
    frame();
  })();

  (function () {
    var cv = document.getElementById('meter'), cx = cv.getContext('2d');
    var N = 160, M = 30, lv = [], pk = [], ph = [], k;
    var W = 0, H = 0, dpr = 1, act = 0, beat = 0, nextK = 0, tPrev = 0, lastD = 0;
    for (k = 0; k < N; k++) { lv[k] = 0; pk[k] = 0; ph[k] = 0; }

    function size() {
      var r = cv.getBoundingClientRect();
      dpr = window.devicePixelRatio || 1;
      W = Math.round(r.width); H = Math.round(r.height);
      if (W < 2 || H < 2) return;
      cv.width = Math.round(W * dpr); cv.height = Math.round(H * dpr);
    }
    function clamp(v) { return v < 0 ? 0 : (v > 1 ? 1 : v); }
    function hue(x) { return (330 + x * 300) % 360; }
    function band(a, i) {
      var s = Math.floor(i * N / M), e = Math.max(s + 1, Math.floor((i + 1) * N / M)), t = 0, j;
      for (j = s; j < e; j++) t += a[j];
      return t / (e - s);
    }
    function rr(x, y, w, h, r) {
      r = Math.max(0, Math.min(r, w / 2, h / 2));
      cx.beginPath(); cx.moveTo(x + r, y); cx.arcTo(x + w, y, x + w, y + h, r); cx.arcTo(x + w, y + h, x, y + h, r);
      cx.arcTo(x, y + h, x, y, r); cx.arcTo(x, y, x + w, y, r); cx.closePath();
    }

    function step(t) {
      var dt = Math.min(0.1, t - tPrev), x, a, b, v, tg, up, dn, playing, buf, i;
      tPrev = t; if (dt <= 0) return;
      playing = wantPlay && !au.paused && nowSt.className === 'on';
      buf = wantPlay && nowSt.className === 'buf';
      tg = playing ? 1 : (buf ? 0.1 : 0);
      act += (tg - act) * (1 - Math.pow(0.92, dt * 60));
      if (t >= nextK) { beat = 1; nextK = t + 0.44 + Math.random() * 0.1; }
      beat *= Math.pow(0.86, dt * 60);
      up = 1 - Math.pow(0.45, dt * 60); dn = 1 - Math.pow(0.9, dt * 60);
      for (i = 0; i < N; i++) {
        x = i / (N - 1);
        a = 0.5 + 0.5 * Math.sin(t * (1.7 + i * 0.37 * 32 / N) + i * 1.3);
        b = 0.5 + 0.5 * Math.sin(t * (3.1 + i * 0.21 * 32 / N) + i * 0.7);
        v = (1 - 0.45 * x) * (0.3 + 0.5 * a * b + 0.35 * Math.random()) + beat * (1 - x) * 0.5;
        v = clamp(v * act * 1.35);
        lv[i] += (v - lv[i]) * (v > lv[i] ? up : dn);
        if (lv[i] >= pk[i]) { pk[i] = lv[i]; ph[i] = 0.35; }
        else if (ph[i] > 0) ph[i] -= dt;
        else pk[i] = Math.max(lv[i], pk[i] - dt * 0.8);
      }
    }

    function draw() {
      var p = Math.round(Math.min(6, H * 0.14)), x0 = p, y0 = p, w = W - 2 * p, h = H - 2 * p, g = 2, bw, i, bh;
      M = Math.max(24, Math.min(N, Math.round((w + g) / 10))); bw = (w - (M - 1) * g) / M;
      cx.setTransform(dpr, 0, 0, dpr, 0, 0); cx.clearRect(0, 0, W, H);
      cx.fillStyle = 'rgba(0,0,0,.4)'; cx.fillRect(0, 0, W, H);
      for (i = 0; i < M; i++) {
        bh = Math.max(1.5, band(lv, i) * h);
        cx.fillStyle = 'hsl(' + hue(i / (M - 1)) + ',100%,60%)';
        rr(x0 + i * (bw + g), y0 + h - bh, bw, bh, 1.5); cx.fill();
        cx.fillStyle = 'rgba(255,255,255,.9)';
        cx.fillRect(x0 + i * (bw + g), y0 + h - Math.max(2, band(pk, i) * h) - 1.5, bw, 1.5);
      }
    }
    function loop(ts) {
      requestAnimationFrame(loop);
      if (cv.offsetWidth < 2 || ts - lastD < 33) return;
      lastD = ts;
      if (!W || Math.round(cv.getBoundingClientRect().width) !== W) size();
      step(ts / 1000); draw();
    }
    window.addEventListener('resize', size);
    size();
    requestAnimationFrame(loop);
  })();
</script>
