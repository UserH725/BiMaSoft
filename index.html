  @import url('https://fonts.googleapis.com/css2?family=Cabin:ital,wght@0,700;1,700&display=swap');
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: #000; color: #e8e8e8; font-family: "Segoe UI", system-ui, -apple-system, Roboto, Arial, sans-serif; font-size: 15px; }
  button, input { font: inherit; color: inherit; }
  :focus-visible { outline: 2px solid #4fb3ff; outline-offset: 2px; }

  #hdr { position: sticky; top: 0; z-index: 10; background: #000; border-bottom: 1px solid rgba(255,255,255,.12); }
  #player { position: relative; z-index: 0; display: flex; align-items: center; gap: 12px; height: 70px; padding: 0 16px; padding-top: env(safe-area-inset-top, 0px); background: #000; border-bottom: 1px solid rgba(255,255,255,.12); overflow: hidden; }
  
  #notes { position: fixed; inset: 0; z-index: 0; overflow: hidden; pointer-events: none; display: flex; align-items: center; justify-content: center; }
  #bgDisc {
    position: absolute; width: min(85vw, 85vh); height: min(85vw, 85vh); border-radius: 50%; opacity: 0.40; filter: blur(0px);
    animation: discSpin 10s linear infinite; animation-play-state: paused;
    background:
      radial-gradient(circle at 50% 33%, rgba(255,255,255,.95) 0 1.6px, transparent 2.2px),
      radial-gradient(circle at center, #ff7ac0 0, #ff2d95 11px, #fff 11.5px 12.5px, transparent 13px),
      conic-gradient(from 20deg, transparent 0 4%, rgba(0,200,255,.32) 10%, rgba(255,255,255,.38) 14%, rgba(255,45,149,.3) 18%, transparent 26%, transparent 50%, rgba(0,200,255,.32) 60%, rgba(255,255,255,.38) 64%, rgba(255,45,149,.3) 68%, transparent 76%),
      repeating-radial-gradient(circle at center, #0b0b0b 0 2px, #1c1c1c 2px 3px);
  }

  body.is-playing #bgDisc { animation-play-state: running; }

  #notes .rn { 
    position: absolute; top: 100%; line-height: 1; opacity: 0; will-change: transform, opacity; 
    animation-name: rnUp; animation-timing-function: ease-out; animation-iteration-count: infinite; animation-play-state: paused;
  }
  body.is-playing #notes .rn { animation-play-state: running; }

  main { position: relative; z-index: 1; }
  @keyframes rnUp { 0% { transform: translateY(0) rotate(-12deg); opacity: 0; } 8% { opacity: .5; } 85% { opacity: .5; } 100% { transform: translateY(calc(-100vh - 60px)) rotate(14deg); opacity: 0; } }

  #now { flex: 1 1 auto; min-width: 0; text-shadow: 0 1px 3px #000, 0 0 8px #000; }
  #nowRadio {   font-family: 'Cabin', sans-serif;   font-style: italic;   font-weight: 700;   font-size: 17px;   line-height: 1.15;   color: #ffe600;   white-space: nowrap;   overflow: hidden; }
  #nowRadio span, #ovName span, #ovSong span { display: inline-block; }
  #nowRadioRow { display: flex; align-items: center; gap: 8px; min-width: 0; }
  #nowRadioRow #nowRadio { flex: 1 1 auto; min-width: 0; }
  #nowLg { flex: 0 0 auto; width: 20px; height: 20px; margin: -1px 0; object-fit: contain; filter: drop-shadow(0 1px 2px rgba(0,0,0,.6)); }
  #ovNameRow { display: flex; align-items: center; justify-content: center; gap: .3em; min-width: 0; }
  #ovNameRow #ovName { font-size: inherit; flex: 0 1 auto; min-width: 0; }
  #ovLg { flex: 0 0 auto; width: 1.1em; height: 1.1em; object-fit: contain; filter: drop-shadow(0 1px 3px rgba(0,0,0,.7)); }
  #nowLg[hidden], #ovLg[hidden] { display: none; }
  #nowIc { flex: 0 0 22px; width: 22px; text-align: center; color: #4fb3ff; font-size: 14px; }
  #nowEq { display: none; }
  body.is-playing #nowEq { display: flex; }
  body.is-playing #nowIc { display: none; }
  #nowRadio.mq span, #ovName.mq span, #ovSong.mq span { animation: mq var(--t, 8s) ease-in-out infinite alternate; }

        try { key = JSON.parse('"' + m[1] + '"'); } catch (x) { return; }
        if (!own(map, key)) order.push(key);
        map[key] = m[2];
      });
      Object.keys(LOGO_MODS.set).forEach(function (key) {
        if (!own(map, key)) order.push(key);
        map[key] = LOGO_MODS.set[key];
      });
      order = order.filter(function (key) {   /* '' = nessun logo: tolgo la voce, a meno che un gruppo («rds*») la coprirebbe */
        var cov;
        if (map[key] !== '') return true;
        cov = order.some(function (g) { return g !== key && g.charAt(g.length - 1) === '*' && map[g] && key.indexOf(g.slice(0, -1)) === 0; });
        if (cov) return true;
        delete map[key]; return false;
      });
      return html.slice(0, a) + mk + '\n' + order.map(function (key) { return '    ' + jq(key) + ': "' + map[key] + '"'; }).join(',\n') + '\n  ' + html.slice(cl);
    }
    function patch(src) {
      var a = src.indexOf('var STATIONS = ['), e = src.indexOf('\n  ];', a), open = 'var STATIONS = [', ents = [], del = {}, add = {}, vm, o = { html: '', ver: '' };
      RADIO_MODS.del.forEach(function (n) { del[lc(n)] = 1; });
      RADIO_MODS.add.forEach(function (s) { add[lc(s.name)] = 1; });
      src.slice(a + open.length, e).split('\n').forEach(function (ln) {
        var t = ln.trim().replace(/,$/, ''), m = /^\{name: '((?:[^'\\]|\\.)*)'/.exec(t), n;
        if (!m) return;
        n = lc(m[1].replace(/\\(.)/g, '$1'));
        if (!del[n] && !add[n]) ents.push({ n: m[1].replace(/\\(.)/g, '$1'), t: t });
      });
      RADIO_MODS.add.forEach(function (s) { ents.push({ n: s.name, t: ser(s) }); });
      ents.sort(function (x, y) { return cmp(x.n, y.n); });
      o.html = src.slice(0, a) + open + '\n' + ents.map(function (x) { return '    ' + x.t; }).join(',\n') + src.slice(e);
      o.html = patchLogos(o.html);
      vm = /(<div id="ver">[^<]*?v\.)(\d+(?:\.\d+)*)/.exec(o.html);
      if (vm) {
        var parts = vm[2].split('.'), last = parseInt(parts.pop(), 10) || 0, pre = parts.join('.'), st = null, n2;
        try { st = (localStorage.getItem('radioVer') || '').split(':'); } catch (x) {}
        if (st && st[0] === pre && parseInt(st[1], 10) > last) last = parseInt(st[1], 10);
        n2 = last + 1;
        try { localStorage.setItem('radioVer', pre + ':' + n2); } catch (x) {}
        o.ver = (pre ? pre + '.' : '') + n2;
        o.html = o.html.replace(vm[0], vm[1] + o.ver);
      }
      return o;
    }
    function getSource() {
      return fetch(location.href.split('#')[0], { cache: 'no-store' }).then(function (r) {
        if (!r.ok) throw new Error('http');
        return r.text();
      }).then(function (t) { if (t.indexOf('var STATIONS = [') < 0) throw new Error('src'); return t; });
    }
    function writeOut(src, hp, desc) {
      var o = patch(src), blob = new Blob([o.html], { type: 'text/html;charset=utf-8' });
      function ok(how) { dirty = true; setMsg('Fatto: ' + desc + '. ' + how + (o.ver ? ' (versione ' + o.ver + ')' : '') + '. Ora carica index.html su GitHub.', 1); }
      function dl() {
        var a = document.createElement('a');
        a.href = URL.createObjectURL(blob); a.download = 'index.html'; document.body.appendChild(a); a.click();
        setTimeout(function () { URL.revokeObjectURL(a.href); a.remove(); }, 2000);
        ok('File scaricato nella cartella dei download del browser');
      }
      if (!hp) { dl(); return; }
      hp.then(function (h) {
        return h.createWritable().then(function (w) { return w.write(blob).then(function () { return w.close(); }); });
      }).then(function () { ok('File salvato'); }, function (e) {
        if (e && e.name === 'AbortError') { dirty = true; setMsg('Modifica salvata nel browser, ma il file non è stato salvato. Usa «Salva HTML sul desktop».', 0); }
        else dl();
      });
    }
    function askFile(hp, desc) {
      var p = $('mgP');
      if (!p) return;
      p.innerHTML = '<p class="mgM">Da qui non riesco a leggere il file sorgente (succede aprendo la pagina dal disco). Seleziona il file <b>index.html</b> attuale:</p><input id="mgFile" type="file" accept=".html,text/html">';
      $('mgFile').onchange = function () {
        var f = this.files && this.files[0], r;
        if (!f) return;
        r = new FileReader();
        r.onload = function () {
          var t = String(r.result);
          if (t.indexOf('var STATIONS = [') < 0) { setMsg('Il file scelto non è la pagina Radio.', 0); return; }
          p.innerHTML = ''; writeOut(t, hp, desc);
        };
        r.readAsText(f);
      };
      setMsg('Serve il file sorgente.', 0);
    }
    /* va chiamata direttamente dal click dell'utente: il selettore di salvataggio richiede il gesto */
    function exportFile(desc) {
      var hp = null;
      if (window.showSaveFilePicker) {
        try { hp = window.showSaveFilePicker({ suggestedName: 'index.html', startIn: 'desktop', types: [{ description: 'Pagina HTML', accept: { 'text/html': ['.html'] } }] }); } catch (e) { hp = null; }
        if (hp) hp.catch(function () {});
      }
      setMsg('Preparo il file...', 0);
      getSource().then(function (src) { writeOut(src, hp, desc); }, function () { askFile(hp, desc); });
    }

    /* ---- schermate ---- */
    function viewPwd() {
      var pw;
      show('<h2>Accesso</h2><p>Inserisci la password per gestire le radio.</p><input id="mgPw" type="password" inputmode="numeric" autocomplete="off" placeholder="Password"><p class="mgE" id="mgE"></p><div class="mgB"><button id="mgNo" type="button" class="g">Annulla</button><button id="mgOk" type="button">Entra</button></div>');
      pw = $('mgPw');
      function go() {
        var r = chk(pw.value.trim());
        if (r > 0) viewMain();
        else { $('mgE').textContent = r < 0 ? 'Accesso scaduto: serve una nuova versione del file.' : 'Password errata.'; pw.value = ''; pw.focus(); }
      }
      $('mgOk').onclick = go; $('mgNo').onclick = closeAll;
      pw.onkeydown = function (e) { if (e.key === 'Enter') go(); };
      setTimeout(function () { pw.focus(); }, 50);
    }
    function lgThumb(sp, n) {
      var u = stLogo(n), im;
      if (!u) return;
      im = document.createElement('img'); im.className = 'tn'; im.alt = ''; im.src = u;
      sp.insertBefore(im, sp.firstChild);
    }
    function drawList() {
      var ul = $('mgL'), f = lc($('mgS') ? $('mgS').value : '');
      if (!ul) return;
      ul.innerHTML = '';
      names().filter(function (n) { return !f || lc(n).indexOf(f) >= 0; }).forEach(function (n) {
        var li = document.createElement('li'), sp = document.createElement('span'), b = document.createElement('button');
        var e = document.createElement('button'), bx = document.createElement('span');
        sp.textContent = n; lgThumb(sp, n); b.type = 'button'; b.textContent = 'Elimina'; e.type = 'button'; e.textContent = 'Modifica'; e.className = 'ed';
        b.onclick = function () { viewDel1(n); }; e.onclick = function () { viewEdit(n); };
        bx.className = 'bx'; bx.appendChild(e); bx.appendChild(b);
        li.appendChild(sp); li.appendChild(bx); ul.appendChild(li);
      });
    }
    function viewMain(msg) {
      show('<div class="mgH"><h2>Gestisci radio</h2><button id="mgX" type="button" class="g">Chiudi</button></div>' +
        '<p class="mgM" id="mgM"></p><div id="mgP"></div>' +
        '<h3>Aggiungi una radio</h3>' +
        '<label>Nome<input id="mgN" type="text" autocomplete="off"></label>' +
        '<label>Indirizzi stream (uno per riga, anche .m3u8)<textarea id="mgU" rows="2" autocomplete="off" autocapitalize="off" spellcheck="false"></textarea></label>' +
        '<label>Info brano in onda (facoltativo, uno per riga)<textarea id="mgI" rows="2" autocomplete="off" autocapitalize="off" spellcheck="false"></textarea></label>' +
        '<label>Formato info<select id="mgF"><option value="">Automatico</option><option value="json">JSON</option><option value="dash">DASH</option></select></label>' +
        LG_FORM +
        '<div class="mgB"><button id="mgT" type="button" class="g">Prova stream</button><button id="mgA" type="button">Aggiungi e salva</button></div>' +
        '<h3>Modifica o elimina una radio</h3><input id="mgS" type="search" placeholder="Cerca" autocomplete="off"><ul class="mgL" id="mgL"></ul>' +
        '<div class="mgB"><button id="mgV" type="button" class="g">Salva HTML sul desktop</button></div>');
      setMsg(msg || '', 0); drawList(); addLg = bindLogo('');
      $('mgX').onclick = closeAll; $('mgS').oninput = drawList; $('mgT').onclick = doTest; $('mgA').onclick = doAdd;
      $('mgV').onclick = function () { exportFile('esportazione del file'); };
    }
    function doTest() {
      var urls = lines($('mgU').value), k = 0, done = false, cancel = null, tm;
      if (!urls.length) { setMsg('Inserisci almeno un indirizzo stream.', 0); return; }
      setMsg('Provo lo stream...', 0);
      function fin(ok) {
        if (done) return; done = true; clearTimeout(tm);
        setMsg(ok ? 'Stream raggiungibile.' : 'Stream non raggiungibile da qui (potrebbe funzionare comunque in ascolto).', ok);
      }
      function nx() {
        if (done) return;
        if (k >= urls.length) { fin(false); return; }
        cancel = probeUrl(urls[k++], function (ok) { if (ok) fin(true); else nx(); });
      }
      tm = setTimeout(function () { try { if (cancel) cancel(); } catch (e) {} fin(false); }, 20000);
      nx();
    }
    /* legge e controlla il modulo; self = nome della radio che si sta modificando (per non segnalarla come doppione) */
    function readForm(self) {
      var name = $('mgN').value.trim(), urls = lines($('mgU').value), info = lines($('mgI').value), fmt = $('mgF').value, bad = false, k, s, all;
      if (!name) return { err: 'Inserisci il nome della radio.' };
      if (!urls.length) return { err: 'Inserisci almeno un indirizzo stream.' };
      all = urls.concat(info);
      all.forEach(function (u) { if (!/^https?:\/\/\S+$/i.test(u)) bad = true; });
      if (bad) return { err: 'Gli indirizzi devono iniziare con http:// o https:// e non avere spazi.' };
      if (location.protocol === 'https:' && all.some(function (u) { return /^http:/i.test(u); })) return { err: 'La pagina è in https: gli indirizzi http:// verrebbero bloccati dal browser.' };
      k = lc(name);
      if (names().some(function (n) { return lc(n) === k && lc(n) !== lc(self || ''); })) return { err: 'Esiste già una radio con questo nome.' };
      s = { name: name, urls: urls };
      if (info.length) s.info = info.length === 1 ? info[0] : info;
      if (info.length && fmt) s.infoFmt = fmt;
      return { s: s };
    }
    function entryOf(name) {
      var k = lc(name), r = null;
      RADIO_MODS.add.forEach(function (x) { if (lc(x.name) === k) r = x; });
      if (!r) STATIONS.forEach(function (x) { if (!r && lc(x.name) === k) r = x; });
      return r;
    }
    function plain(x) {
      var o = { name: x.name, urls: x.urls.slice() };
      if (x.info && x.info.length) o.info = x.info;
      if (x.infoFmt) o.infoFmt = x.infoFmt;
      return JSON.stringify(o);
    }
    function doAdd() {
      var r = readForm(''), s, k;
      if (r.err) { setMsg(r.err, 0); return; }
      s = r.s; k = lc(s.name);
      if (addLg && addLg.data) { logoPut(k, addLg.data); saveLogoMods(); addLg.reset(); }
      RADIO_MODS.add.push(s);
      RADIO_MODS.del = RADIO_MODS.del.filter(function (n) { return lc(n) !== k; });
      saveMods(); dirty = true; drawList();
      $('mgN').value = ''; $('mgU').value = ''; $('mgI').value = ''; $('mgF').value = '';
      exportFile('aggiunta di «' + s.name + '»');
    }
    function viewEdit(name) {
      var x = entryOf(name), inf = x && x.info ? (Array.isArray(x.info) ? x.info : [x.info]) : [];
      if (!x) { viewMain('Radio non trovata.'); return; }
      show('<div class="mgH"><h2>Modifica radio</h2></div><p class="mgM" id="mgM"></p><div id="mgP"></div>' +
        '<label>Nome<input id="mgN" type="text" autocomplete="off"></label>' +
        '<label>Indirizzi stream (uno per riga, anche .m3u8)<textarea id="mgU" rows="3" autocomplete="off" autocapitalize="off" spellcheck="false"></textarea></label>' +
        '<label>Info brano in onda (facoltativo, uno per riga)<textarea id="mgI" rows="3" autocomplete="off" autocapitalize="off" spellcheck="false"></textarea></label>' +
        '<label>Formato info<select id="mgF"><option value="">Automatico</option><option value="json">JSON</option><option value="dash">DASH</option></select></label>' +
        LG_FORM +
        '<div class="mgB"><button id="mgNo" type="button" class="g">Annulla</button><button id="mgT" type="button" class="g">Prova stream</button><button id="mgA" type="button">Salva modifica</button></div>');
      $('mgN').value = x.name; $('mgU').value = x.urls.join('\n'); $('mgI').value = inf.join('\n'); $('mgF').value = x.infoFmt || '';
      $('mgNo').onclick = function () { viewMain(); }; $('mgT').onclick = doTest;
      var lg = bindLogo(stLogo(name));
      $('mgA').onclick = function () {
        var r = readForm(name), s, k0 = lc(name), k1, old = entryOf(name), same;
        if (r.err) { setMsg(r.err, 0); return; }
        s = r.s; k1 = lc(s.name);
        same = !!(old && plain(old) === plain(s));
        if (same && lg.data === null) { setMsg('Nessuna modifica da salvare.', 0); return; }
        if (!same) {
          RADIO_MODS.add = RADIO_MODS.add.filter(function (y) { var k = lc(y.name); return k !== k0 && k !== k1; });
          RADIO_MODS.add.push(s);
          if (k0 !== k1 && !RADIO_MODS.del.some(function (n) { return lc(n) === k0; })) RADIO_MODS.del.push(name);
          RADIO_MODS.del = RADIO_MODS.del.filter(function (n) { return lc(n) !== k1; });
          try { if (localStorage.getItem('radioLast') === name) localStorage.setItem('radioLast', s.name); } catch (e) {}
        }
        applyLogo(name, s.name, lg);
        saveMods(); dirty = true; viewMain();
        exportFile((same ? 'logo aggiornato per «' : 'modificata «') + name + '»' + (k0 !== k1 ? ' (ora «' + s.name + '»)' : ''));
      };
    }
    function viewDel1(name) {
      show('<h2>Elimina radio</h2><p>Vuoi eliminare «<b>' + esc(name) + '</b>»?</p><div class="mgB"><button id="mgNo" type="button" class="g">No</button><button id="mgY" type="button" class="r">Sì, continua</button></div>');
      $('mgNo').onclick = function () { viewMain(); }; $('mgY').onclick = function () { viewDel2(name); };
    }
    function viewDel2(name) {
      var c, d;
      show('<h2>Conferma finale</h2><p>Per eliminarla definitivamente scrivi il nome della radio:<br><b>' + esc(name) + '</b></p><input id="mgC" type="text" autocomplete="off" autocapitalize="off"><div class="mgB"><button id="mgNo" type="button" class="g">Annulla</button><button id="mgD" type="button" class="r" disabled>Elimina</button></div>');
      c = $('mgC'); d = $('mgD');
      c.oninput = function () { d.disabled = lc(c.value) !== lc(name); };
      $('mgNo').onclick = function () { viewMain(); };
      d.onclick = function () {
        var k = lc(name);
        if (lc(c.value) !== k) return;
        RADIO_MODS.add = RADIO_MODS.add.filter(function (s) { return lc(s.name) !== k; });
        if (!RADIO_MODS.del.some(function (n) { return lc(n) === k; })) RADIO_MODS.del.push(name);
        logoDropExact(k);
        saveMods(); dirty = true; viewMain();
        exportFile('eliminata «' + name + '»');
      };
    }
    ver.setAttribute('role', 'button'); ver.setAttribute('tabindex', '0');
    ver.addEventListener('click', function (e) { e.stopPropagation(); viewPwd(); });
    ver.addEventListener('keydown', function (e) { if (e.key === 'Enter') viewPwd(); });
    document.addEventListener('keydown', function (e) { if (!mgr.hidden && e.key === 'Escape') closeAll(); });
  })();
