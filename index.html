<!DOCTYPE html>
<html lang="it" data-g="2" class=""><head><meta http-equiv="Content-Type" content="text/html; charset=UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#000000">
<title>Radio</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext x='50' y='78' font-size='84' text-anchor='middle' fill='%23ff2d95'%3E%E2%99%AB%3C/text%3E%3C/svg%3E">
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: #000; color: #e8e8e8; font-family: "Segoe UI", system-ui, -apple-system, Roboto, Arial, sans-serif; font-size: 15px; }
  button, input { font: inherit; color: inherit; }
  :focus-visible { outline: 2px solid #4fb3ff; outline-offset: 2px; }

  #hdr { position: sticky; top: 0; z-index: 10; background: #000; border-bottom: 1px solid rgba(255,255,255,.12); }
  #player { position: relative; z-index: 0; display: flex; align-items: center; gap: 14px; height: 76px; padding: 0 16px; padding-top: env(safe-area-inset-top, 0px); background: #000; border-bottom: 1px solid rgba(255,255,255,.12); overflow: hidden; }
  
  /* Sfondo Generale con Vinile e Note */
  #notes { position: fixed; inset: 0; z-index: 0; overflow: hidden; pointer-events: none; display: flex; align-items: center; justify-content: center; }
  #bgDisc {
    position: absolute;
    width: min(85vw, 85vh);
    height: min(85vw, 85vh);
    border-radius: 50%;
    opacity: 0.40;
    filter: blur(0px);
    animation: discSpin 10s linear infinite;
    animation-play-state: paused;
    background:
      radial-gradient(circle at 50% 33%, rgba(255,255,255,.95) 0 1.6px, transparent 2.2px),
      radial-gradient(circle at center, #ff7ac0 0, #ff2d95 11px, #fff 11.5px 12.5px, transparent 13px),
      conic-gradient(from 20deg, transparent 0 4%, rgba(0,200,255,.32) 10%, rgba(255,255,255,.38) 14%, rgba(255,45,149,.3) 18%, transparent 26%, transparent 50%, rgba(0,200,255,.32) 60%, rgba(255,255,255,.38) 64%, rgba(255,45,149,.3) 68%, transparent 76%),
      repeating-radial-gradient(circle at center, #0b0b0b 0 2px, #1c1c1c 2px 3px);
  }

  body.is-playing #bgDisc { animation-play-state: running; }

  #notes .rn { 
    position: absolute; top: 100%; line-height: 1; opacity: 0; will-change: transform, opacity; 
    animation-name: rnUp; animation-timing-function: ease-out; animation-iteration-count: infinite; animation-play-state: paused;
  }
  body.is-playing #notes .rn { animation-play-state: running; }

  main { position: relative; z-index: 1; }
  @keyframes rnUp { 0% { transform: translateY(0) rotate(-12deg); opacity: 0; } 8% { opacity: .5; } 85% { opacity: .5; } 100% { transform: translateY(calc(-100vh - 60px)) rotate(14deg); opacity: 0; } }

  #now { flex: 1 1 auto; min-width: 0; text-shadow: 0 1px 3px #000, 0 0 8px #000; }
  #nowName { font-size: 17px; font-weight: 700; white-space: nowrap; overflow: hidden; }
  #nowName span { display: inline-block; }
  #nowName.mq span { animation: mq var(--t, 8s) ease-in-out infinite alternate; }
  @keyframes mq { 0%, 12% { transform: translateX(0); } 88%, 100% { transform: translateX(calc(-1 * var(--d, 0px))); } }
  #nowSt { display: flex; align-items: center; gap: 8px; margin-top: 2px; font-size: 13px; color: #9a9a9a; }
  .led { width: 9px; height: 9px; border-radius: 50%; background: #666; flex: 0 0 auto; }
  #nowSt.on { color: #3ddc84; } #nowSt.on .led { background: #3ddc84; box-shadow: 0 0 8px #3ddc84; }
  #nowSt.buf { color: #ffd24d; } #nowSt.buf .led { background: #ffd24d; animation: blink 1s ease-in-out infinite; }
  #nowSt.err { color: #ff7b7b; } #nowSt.err .led { background: #ff5c5c; }
  @keyframes blink { 50% { opacity: .25; } }

  /* Barra di avanzamento Buffer dinamica */
  #initBufWrap { 
    width: 100%; 
    max-width: 220px; 
    height: 8px; 
    background: rgba(255,255,255,.15); 
    border-radius: 999px; 
    overflow: hidden; 
    margin-top: 6px; 
    display: none; 
    box-shadow: inset 0 1px 3px rgba(0,0,0,.6); 
  }
  #initBufBar { 
    height: 100%; 
    width: 0%; 
    border-radius: 999px; 
    background-color: #ff1744; 
    transition: width .2s linear, background-color .2s linear; 
  }
  #ovInitBufWrap { 
    width: 80%; 
    max-width: 280px; 
    height: 10px; 
    background: rgba(255,255,255,.15); 
    border-radius: 999px; 
    overflow: hidden; 
    margin: 8px auto 0; 
    display: none; 
    box-shadow: inset 0 1px 3px rgba(0,0,0,.6); 
  }
  #ovInitBufBar { 
    height: 100%; 
    width: 0%; 
    border-radius: 999px; 
    background-color: #ff1744; 
    transition: width .2s linear, background-color .2s linear; 
  }

  #volbox { flex: 0 0 auto; display: flex; align-items: center; gap: 10px; text-shadow: 0 1px 3px #000, 0 0 8px #000; }
  #volIc { flex: 0 0 auto; width: 22px; height: 22px; color: #e8e8e8; filter: drop-shadow(0 1px 2px rgba(0,0,0,.7)); }
  #volIc .w, #volIc .mx { opacity: 0; transition: opacity .15s ease; }
  #volIc[data-l="1"] .w1, #volIc[data-l="2"] .w1, #volIc[data-l="2"] .w2, #volIc[data-l="3"] .w { opacity: 1; }
  #volIc[data-l="0"] .mx { opacity: 1; }
  #volVal { flex: 0 0 auto; min-width: 4ch; text-align: right; font-size: 12px; font-weight: 600; font-variant-numeric: tabular-nums; color: #e8e8e8; }
  #vol { --p: 100%; -webkit-appearance: none; appearance: none; flex: 0 0 auto; width: 130px; height: 24px; margin: 0; padding: 0; background: transparent; cursor: pointer; border-radius: 12px; }
  #vol::-webkit-slider-runnable-track { height: 6px; border-radius: 999px; box-shadow: 0 0 0 1px rgba(255,255,255,.22), 0 1px 4px rgba(0,0,0,.6);
    background: linear-gradient(90deg, transparent var(--p), #1c1c1c var(--p)), linear-gradient(90deg, #00c8ff, #7a3dff 55%, #ff2d95); }
  #vol::-moz-range-track { height: 6px; border-radius: 999px; box-shadow: 0 0 0 1px rgba(255,255,255,.22), 0 1px 4px rgba(0,0,0,.6);
    background: linear-gradient(90deg, transparent var(--p), #1c1c1c var(--p)), linear-gradient(90deg, #00c8ff, #7a3dff 55%, #ff2d95); }
  #vol::-webkit-slider-thumb { -webkit-appearance: none; appearance: none; width: 16px; height: 16px; margin-top: -5px; border-radius: 50%; border: 0; background: #fff;
    box-shadow: 0 0 0 2px rgba(0,0,0,.55), 0 2px 8px rgba(0,0,0,.7), 0 0 10px rgba(255,45,149,.55); transition: transform .12s ease; }
  #vol::-moz-range-thumb { width: 16px; height: 16px; border-radius: 50%; border: 0; background: #fff;
    box-shadow: 0 0 0 2px rgba(0,0,0,.55), 0 2px 8px rgba(0,0,0,.7), 0 0 10px rgba(255,45,149,.55); transition: transform .12s ease; }
  #vol:hover::-webkit-slider-thumb, #vol:active::-webkit-slider-thumb { transform: scale(1.18); }
  #vol:hover::-moz-range-thumb, #vol:active::-moz-range-thumb { transform: scale(1.18); }

  main { max-width: 980px; margin: 0 auto; padding: 18px 16px calc(40px + env(safe-area-inset-bottom, 0px)); }
  .head { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; margin-bottom: 14px; }
  h1 { margin: 0; font-size: 22px; font-weight: 700; }
  #count { color: #9a9a9a; font-size: 14px; }
  #find { flex: 1 1 200px; max-width: 360px; margin-left: auto; height: 38px; padding: 0 12px; background: #111; border: 1px solid #555; border-radius: 6px; }
  #find:focus { outline: none; border-color: #4fb3ff; }

  #list { list-style: none; margin: 0; padding: 0; display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 0 18px; }
  #list li { border-bottom: 1px solid #1d1d1d; }
  #list li[hidden] { display: none; }
  .st { display: flex; align-items: center; gap: 12px; width: 100%; min-height: 50px; padding: 6px 8px; background: none; border: 0; border-radius: 6px; text-align: left; cursor: pointer; }
  .st:hover { background: rgba(255,255,255,.07); }
  .st .nm { flex: 1 1 auto; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-weight: 600; }
  .st .ic { flex: 0 0 22px; width: 22px; text-align: center; color: #6a6a6a; font-size: 14px; }
  .st.cur .nm { color: #fff; }
  .st.cur .ic { color: #4fb3ff; }
  .eq { flex: 0 0 22px; width: 22px; height: 18px; display: none; align-items: flex-end; justify-content: center; gap: 3px; }
  .eq i { width: 4px; height: 100%; border-radius: 1px; transform-origin: bottom; animation: eq .9s ease-in-out infinite; }
  .eq i:nth-child(1) { background: #ff2d95; animation-delay: -.2s; } .eq i:nth-child(2) { background: #ffe600; animation-delay: -.5s; } .eq i:nth-child(3) { background: #00c8ff; animation-delay: -.8s; }
  @keyframes eq { 0%, 100% { transform: scaleY(.2); } 50% { transform: scaleY(1); } }
  .st.cur.live .eq { display: flex; } .st.cur.live .ic { display: none; }
  #none { color: #9a9a9a; padding: 18px 8px; }
  #none[hidden] { display: none; }

  @media (max-width: 560px) { #volbox { display: none; } #player { gap: 12px; } }
  @media (prefers-reduced-motion: reduce) { #player::before { animation: none !important; } #notes { display: none; } #nowName { text-overflow: ellipsis; } #nowName.mq span { animation: none; } #btn { animation: none; } .eq i { animation: none; transform: scaleY(.6); } #nowSt.buf .led { animation: none; } }

  @property --ang { syntax: '<angle>'; inherits: false; initial-value: 0deg; }
  #player::before { content: ""; position: absolute; inset: -34px; z-index: -1; filter: blur(22px) saturate(1.15); pointer-events: none; opacity: 1; transition: opacity .9s ease; }
  #player.fo::before { opacity: 0; }
  #player::after  { content: ""; position: absolute; inset: 0; z-index: -1; background: rgba(0,0,0,.26); pointer-events: none; }
  #player[data-g="0"]::before, #player[data-g="0"]::after { display: none; }
  #player[data-g="0"] { background: rgba(0,0,0,.55); }
  #nowSt { text-shadow: 0 1px 3px #000, 0 0 8px #000; }
  @keyframes gx { to { background-position: 200% 0; } }
  @keyframes gdiag { to { background-position: 200% 200%; } }
  @keyframes gblob { from { background-position: 0% 0%, 100% 0%, 0% 100%, 100% 100%; } to { background-position: 100% 100%, 0% 100%, 100% 0%, 0% 0%; } }
  @keyframes gspin { to { --ang: 360deg; } }
  #player[data-g="1"]::before, html[data-g="1"] #list .st.cur::before, html[data-g="1"] #ov .ovc::before { background: linear-gradient(90deg, #ff2d95, #ff9500, #ffe600, #2dff7a, #00c8ff, #7a3dff, #ff2d95); background-size: 200% 100%; animation: gx 12s linear infinite; }
  #player[data-g="2"]::before, html[data-g="2"] #list .st.cur::before, html[data-g="2"] #ov .ovc::before { background-color: #14083a; background-repeat: no-repeat; background-size: 200% 200%, 180% 180%, 220% 220%, 160% 160%;
    background-image: radial-gradient(45% 100% at 20% 50%, #ff2d95, transparent 70%), radial-gradient(45% 100% at 50% 40%, #00c8ff, transparent 70%), radial-gradient(45% 100% at 80% 60%, #7a3dff, transparent 70%), radial-gradient(45% 100% at 60% 50%, #2dff7a, transparent 70%);
    animation: gblob 16s ease-in-out infinite alternate; }
  #player[data-g="3"]::before, html[data-g="3"] #list .st.cur::before, html[data-g="3"] #ov .ovc::before { background: linear-gradient(100deg, #ff512f, #dd2476, #7a3dff, #dd2476, #ff512f); background-size: 200% 100%; animation: gx 14s linear infinite; }
  #player[data-g="4"]::before, html[data-g="4"] #list .st.cur::before, html[data-g="4"] #ov .ovc::before { background: linear-gradient(100deg, #00c6ff, #0072ff, #00e5c3, #0072ff, #00c6ff); background-size: 200% 100%; animation: gx 14s linear infinite; }
  #player[data-g="5"]::before, html[data-g="5"] #list .st.cur::before, html[data-g="5"] #ov .ovc::before { background: linear-gradient(100deg, #ff1e00, #ff7a00, #ffd000, #ff7a00, #ff1e00); background-size: 200% 100%; animation: gx 8s linear infinite; }
  #player[data-g="6"]::before, html[data-g="6"] #list .st.cur::before, html[data-g="6"] #ov .ovc::before { background: linear-gradient(100deg, #0f9b6e, #38ef7d, #c6f03a, #38ef7d, #0f9b6e); background-size: 200% 100%; animation: gx 14s linear infinite; }
  #player[data-g="7"]::before, html[data-g="7"] #list .st.cur::before, html[data-g="7"] #ov .ovc::before { background: linear-gradient(100deg, #ff6fb5, #ffb86b, #7ee8a0, #6ec5ff, #b48cff, #ff6fb5); background-size: 200% 100%; animation: gx 12s linear infinite; }
  #player[data-g="8"]::before, html[data-g="8"] #list .st.cur::before, html[data-g="8"] #ov .ovc::before { inset: -300px -34px; background: conic-gradient(from var(--ang) at 50% 50%, #ff2d95, #ffe600, #2dff7a, #00c8ff, #7a3dff, #ff2d95); animation: gspin 9s linear infinite; }
  #player[data-g="9"]::before, html[data-g="9"] #list .st.cur::before, html[data-g="9"] #ov .ovc::before { background-color: #3a0a1a; background-repeat: no-repeat; background-size: 200% 200%, 170% 170%, 230% 230%, 160% 160%;
    background-image: radial-gradient(45% 100% at 20% 50%, #ff2d95, transparent 70%), radial-gradient(45% 100% at 50% 40%, #ff9500, transparent 70%), radial-gradient(45% 100% at 80% 60%, #ffe600, transparent 70%), radial-gradient(45% 100% at 60% 50%, #7a3dff, transparent 70%);
    animation: gblob 8s ease-in-out infinite alternate; }

  #bufrow { position: relative; height: 20px; background: #111; overflow: hidden; --c: #3ddc84; }
  #bfill { position: absolute; inset: 0; background: linear-gradient(90deg, #e53935 0%, #ff9800 35%, #e6d422 65%, #0a7d32 100%); clip-path: inset(0 100% 0 0); transition: clip-path .45s ease; }
  #bftxt { position: absolute; right: 12px; top: 0; bottom: 0; display: flex; align-items: center; font-size: 12px; font-weight: 600; font-variant-numeric: tabular-nums; color: #fff; white-space: nowrap; text-shadow: 0 1px 3px #000, 0 0 6px #000; }
  #clock { flex: 0 0 auto; text-align: center; line-height: 1.15; font-variant-numeric: tabular-nums; text-shadow: 0 1px 3px #000, 0 0 8px #000; }
  #clock b { display: block; font-size: 22px; font-weight: 700; color: #fff; }
  #ck .dg { position: relative; display: inline-block; width: 1ch; height: 1.15em; overflow: hidden; vertical-align: top; }
  #ck .dg > span { position: absolute; left: 0; top: 0; width: 100%; text-align: center; }
  #clock #cd { display: block; font-size: 11px; color: #cfcfcf; white-space: nowrap; }
  
  #netStat { display: block; font-size: 10.5px; font-weight: 600; color: #8ab4f8; white-space: nowrap; margin-top: 1px; }
  #netStat span { font-variant-numeric: tabular-nums; }

  #rc { display: flex; flex-direction: column; align-items: center; gap: 2px; }
  #rc #clock b { font-size: 20px; }
  #ana { flex: 0 0 auto; width: 64px; height: 64px; filter: drop-shadow(0 1px 4px rgba(0,0,0,.6)); }
  #ana svg { display: block; width: 100%; height: 100%; }
  @media (max-width: 560px) { #ana { display: none; } }

  #list .st { border: 1.5px solid transparent; }
  #list .st.cur { position: relative; z-index: 0; overflow: hidden; background: rgba(255,255,255,.1); border-color: rgba(255,255,255,.35); box-shadow: 0 0 14px rgba(0,0,0,.4); }
  #list .st.cur .nm, #list .st.cur .ic { text-shadow: 0 1px 3px #000, 0 0 8px #000; }
  #list .st.cur::before { content: ""; position: absolute; inset: -20px; z-index: -1; filter: blur(14px) saturate(1.15); pointer-events: none; opacity: 1; transition: opacity .9s ease; }
  #list .st.cur::after { content: ""; position: absolute; inset: 0; z-index: -1; background: rgba(0,0,0,.26); pointer-events: none; }
  html[data-g="0"] #list .st.cur::before, html[data-g="0"] #list .st.cur::after, html[data-g="0"] #ov .ovc::before, html[data-g="0"] #ov .ovc::after { display: none; }
  html.fo #list .st.cur::before, html.fo #ov .ovc::before { opacity: 0; }
  @media (prefers-reduced-motion: reduce) { #list .st.cur::before, #ov .ovc::before { animation: none !important; } }

  #ov { position: fixed; left: 0; right: 0; bottom: 0; top: var(--hh, 0px); z-index: 5; background: rgba(0,0,0,0); transition: background .35s ease; cursor: pointer; -webkit-tap-highlight-color: transparent; touch-action: none; }
  #ov[hidden] { display: none; }
  #ov.open { background: rgba(0,0,0,.62); }
  
  #ov .ovc { position: fixed; z-index: 2; overflow: hidden; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 12px; padding: 20px; text-align: center;
    border: 1.5px solid rgba(255,255,255,.35); border-radius: 6px; background: rgba(255,255,255,.1); box-shadow: 0 0 14px rgba(0,0,0,.4);
    transition: top .38s cubic-bezier(.2,.8,.2,1), left .38s cubic-bezier(.2,.8,.2,1), width .38s cubic-bezier(.2,.8,.2,1), height .38s cubic-bezier(.2,.8,.2,1), border-radius .38s ease, box-shadow .38s ease; }
  #ov.open .ovc { border-radius: 18px; box-shadow: 0 8px 40px rgba(0,0,0,.65); }
  #ov .ovc:focus { outline: none; }
  #ov .ovc:focus-visible { outline: 2px solid #4fb3ff; outline-offset: 3px; }
  #ov .ovc::before { content: ""; position: absolute; inset: -20px; z-index: -2; filter: blur(14px) saturate(1.15); pointer-events: none; opacity: 1; transition: opacity .9s ease; }
  #ov .ovc::after { content: ""; position: absolute; inset: 0; z-index: -2; background: rgba(0,0,0,.26); pointer-events: none; }

  /* Vinile integrato nella sovraimpressione */
  #ov .ovc-disc {
    position: absolute;
    width: min(70vw, 70vh, 280px);
    height: min(70vw, 70vh, 280px);
    border-radius: 50%;
    opacity: 0.35;
    z-index: -1;
    pointer-events: none;
    animation: discSpin 10s linear infinite;
    animation-play-state: paused;
    background:
      radial-gradient(circle at 50% 33%, rgba(255,255,255,.95) 0 1.6px, transparent 2.2px),
      radial-gradient(circle at center, #ff7ac0 0, #ff2d95 11px, #fff 11.5px 12.5px, transparent 13px),
      conic-gradient(from 20deg, transparent 0 4%, rgba(0,200,255,.32) 10%, rgba(255,255,255,.38) 14%, rgba(255,45,149,.3) 18%, transparent 26%, transparent 50%, rgba(0,200,255,.32) 60%, rgba(255,255,255,.38) 64%, rgba(255,45,149,.3) 68%, transparent 76%),
      repeating-radial-gradient(circle at center, #0b0b0b 0 2px, #1c1c1c 2px 3px);
  }
  body.is-playing #ov .ovc-disc {
    animation-play-state: running;
  }

  #ov .ovi { position: relative; z-index: 1; width: 100%; min-width: 0; opacity: 0; transition: opacity .2s ease; text-shadow: 0 1px 3px #000, 0 0 10px #000, 0 0 16px #000; }
  #ov.open .ovi { opacity: 1; transition: opacity .3s ease .15s; }
  #ovName, #ovStTx, #ovSong, #ovHint { white-space: pre-wrap; }
  #ovName { font-size: clamp(22px, 6vw, 34px); font-weight: 700; line-height: 1.15; color: #fff; overflow-wrap: anywhere; }
  #ovSt { display: flex; align-items: center; justify-content: center; gap: 8px; margin-top: 12px; font-size: 15px; color: #cfcfcf; }
  #ovSt.on { color: #3ddc84; } #ovSt.on .led { background: #3ddc84; box-shadow: 0 0 8px #3ddc84; }
  #ovSt.buf { color: #ffd24d; } #ovSt.buf .led { background: #ffd24d; animation: blink 1s ease-in-out infinite; }
  #ovSt.err { color: #ff7b7b; } #ovSt.err .led { background: #ff5c5c; }
  #ovSong { margin-top: 10px; font-size: clamp(15px, 4vw, 20px); color: #fff; overflow-wrap: anywhere; display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
  #ovSong:empty { display: none; }
  #ovHint { margin-top: 16px; font-size: 12px; color: #cfcfcf; opacity: .8; }
  @media (prefers-reduced-motion: reduce) { #ov, #ov .ovc, #ov .ovi { transition: none !important; } #ovSt.buf .led { animation: none; } }

  #player .pl { flex: 1 1 0; min-width: 0; display: flex; align-items: center; gap: 14px; }
  #player .pr { flex: 1 1 0; display: flex; align-items: center; justify-content: flex-end; gap: 14px; }
  #mtr { display: block; height: 40px; background: #000; }
  #meter { display: block; width: 100%; height: 40px; pointer-events: none; }
  @media (prefers-reduced-motion: reduce) { #mtr { display: none; } }

  #btn { flex: 0 0 auto; position: relative; width: 52px; height: 52px; border-radius: 50%; border: 2px solid #2b2b2b; background: #0b0b0b; cursor: pointer; padding: 0; font-size: 0; line-height: 1; color: transparent; box-shadow: 0 4px 12px rgba(0,0,0,.6), 0 0 0 1px rgba(255,255,255,.18); transition: transform .15s ease, box-shadow .3s ease; }
  #btn.is-on { box-shadow: 0 4px 12px rgba(0,0,0,.6), 0 0 0 1px rgba(255,255,255,.3), 0 0 14px rgba(255,45,149,.45); }
  #btn:hover { transform: scale(1.08); }
  #btn:active { transform: scale(.94); }
  #btn::before { content: ""; position: absolute; inset: 0; border-radius: 50%; animation: discSpin 2.4s linear infinite; animation-play-state: paused;
    background:
      radial-gradient(circle at 50% 33%, rgba(255,255,255,.95) 0 1.6px, transparent 2.2px),
      radial-gradient(circle at center, #ff7ac0 0, #ff2d95 11px, #fff 11.5px 12.5px, transparent 13px),

    function apply(g) { pl.setAttribute('data-g', g); de.setAttribute('data-g', g); pl.classList.remove('fo'); de.classList.remove('fo'); }
    function set(g, instant) {
      cur = g; store('radioGrad', g);
      clearTimeout(fadeT);
      if (instant) { apply(g); return; }
      pl.classList.add('fo'); de.classList.add('fo');
      fadeT = setTimeout(function () { apply(g); }, 900);
    }
    var sv = parseInt(load('radioGrad'), 10);
    set(isNaN(sv) || sv < 1 || sv > 9 ? 1 : sv, true);
    tm = setInterval(function () { set(cur >= 9 || cur < 1 ? 1 : cur + 1); }, PERIOD);
  })();

  (function () {
    var T = INIT_BUFFER_TARGET, FULL = 5, box = document.getElementById('bufrow'), bf = document.getElementById('bfill'), bt = document.getElementById('bftxt');
    var lastBufferedSec = 0;

    function upd() {
      if (!(wantPlay && cur >= 0)) { bf.style.clipPath = 'inset(0 100% 0 0)'; bt.textContent = ''; box.title = ''; lastBufferedSec = 0; return; }
      var r = au.buffered, t = au.currentTime, s = 0, k, lv, kbps, kb, p, f, sz;
      for (k = 0; k < r.length; k++) { if (t >= r.start(k) - 0.3 && t <= r.end(k) + 0.3) { s = Math.max(0, r.end(k) - t); break; } }
      
      if (!hls && s > lastBufferedSec) {
        var diffSec = s - lastBufferedSec;
        addDownloadedBytes(diffSec * (128 * 1024 / 8));
      }
      lastBufferedSec = s;

      lv = hls && hls.levels && hls.levels[hls.currentLevel >= 0 ? hls.currentLevel : 0];
      kbps = lv && lv.bitrate ? lv.bitrate / 1000 : 128;
      kb = s * kbps / 8; p = Math.min(100, Math.round(s / T * 100)); f = Math.min(1, (s / T * 100) / FULL);
      sz = '~' + (kb >= 1024 ? (kb / 1024).toFixed(1).replace('.', ',') + ' MB' : Math.round(kb) + ' KB');
      bf.style.clipPath = 'inset(0 ' + ((1 - f) * 100).toFixed(1) + '% 0 0)';
      bt.textContent = 'Buffer ' + p + '% \u00B7 ' + sz + ' \u00B7 ' + Math.round(s) + ' s';
      box.title = 'Buffer: ' + s.toFixed(1).replace('.', ',') + ' s in coda su ' + T + ' s target \u00B7 dimensione stimata a ' + Math.round(kbps) + ' kbps';
    }
    au.addEventListener('playing', upd); au.addEventListener('waiting', upd); au.addEventListener('progress', upd);
    setInterval(upd, 500);
  })();

  // --- Pre-buffering: avanzamento completo con sblocco automatico ---
  (function () {
    var doneGen = -1;
    var initWrap = document.getElementById('initBufWrap');
    var ovInitWrap = document.getElementById('ovInitBufWrap');

    function ahead() {
      var r = au.buffered, t = au.currentTime, k;
      for (k = 0; k < r.length; k++) { 
        if (t >= r.start(k) - 0.3 && t <= r.end(k) + 0.3) return Math.max(0, r.end(k) - t); 
      }
      return 0;
    }
    
    function setBufBar(pct) {
      var hue = Math.round((pct / 100) * 140);
      var lightness = Math.round(50 - (pct / 100) * 20);
      var dynamicColor = 'hsl(' + hue + ', 100%, ' + lightness + '%)';

      if (initBufBar) {
        initBufBar.style.width = pct + '%';
        initBufBar.style.backgroundColor = dynamicColor;
      }
      if (ovInitBufBar) {
        ovInitBufBar.style.width = pct + '%';
        ovInitBufBar.style.backgroundColor = dynamicColor;
      }
    }

    function showBar(visible) {
      if (visible) {
        nowSt.classList.add('buf-loading');
        if (ovSt) ovSt.classList.add('buf-loading');
        if (initWrap) initWrap.style.display = 'block';
        if (ovInitWrap) ovInitWrap.style.display = 'block';
      } else {
        nowSt.classList.remove('buf-loading');
        if (ovSt) ovSt.classList.remove('buf-loading');
        if (initWrap) initWrap.style.display = 'none';
        if (ovInitWrap) ovInitWrap.style.display = 'none';
      }
    }

    au.addEventListener('playing', function () {
      if (doneGen === gen) return;
      doneGen = gen;
      
      var need = INIT_BUFFER_TARGET;
      if (hls || ahead() >= need) {
        showBar(false);
        return;
      }
      
      var g = gen;
      var currentPct = 0;
      var startTime = Date.now();
      
      au.pause();
      showBar(true);
      setBufBar(0);
      
      (function w() {
        if (g !== gen || !wantPlay) {
          showBar(false);
          return;
        }
        
        var a = ahead();
        var elapsed = Date.now() - startTime;
        var targetPct = Math.min(100, Math.round((a / need) * 100));
        
        if (currentPct < targetPct) {
          currentPct = Math.min(targetPct, currentPct + 3);
        } else if (elapsed > 500 && currentPct < 95) {
          currentPct += 1;
        }
        
        setBufBar(currentPct);
        
        if (a >= need || currentPct >= 100 || (elapsed > 2500 && a >= 1)) { 
          setBufBar(100);
          setTimeout(function() {
            if (g === gen) {
              showBar(false);
              au.play().catch(onPlayErr(g)); 
            }
          }, 120);
          return; 
        }

        setSt('buf', 'caricamento buffer...');
        showBar(true);

        setTimeout(w, 40);
      })();
    });
  })();

  window.addEventListener('online', function () { if (wantPlay && (nowSt.className !== 'on' || au.readyState < 3)) { tries = 0; clearTimeout(retryT); start(); } });
  window.addEventListener('offline', function () { if (wantPlay) setSt('buf', 'senza rete, attendo...'); });

  (function () {
    var ck = document.getElementById('ck'), cd = document.getElementById('cd');
    var tf = new Intl.DateTimeFormat('it-IT', { hour: '2-digit', minute: '2-digit', second: '2-digit' });
    var df = new Intl.DateTimeFormat('it-IT', { weekday: 'long', day: 'numeric', month: 'long', year: 'numeric' });
    var slots = [], reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    function build(str) {
      var i, ch, el, sp;
      ck.textContent = ''; slots = [];
      for (i = 0; i < str.length; i++) {
        ch = str.charAt(i);
        if (/[0-9]/.test(ch)) {
          el = document.createElement('span'); el.className = 'dg'; el.setAttribute('aria-hidden', 'true');
          sp = document.createElement('span'); sp.textContent = ch; el.appendChild(sp);
          ck.appendChild(el); slots.push({ el: el, v: ch });
        } else {
          el = document.createElement('span'); el.textContent = ch; el.setAttribute('aria-hidden', 'true'); ck.appendChild(el); slots.push(null);
        }
      }
    }
    function roll(s, ch) {
      var old = s.el.lastElementChild, nw = document.createElement('span'), o = { duration: 380, easing: 'cubic-bezier(.3,.9,.3,1)', fill: 'forwards' };
      s.v = ch; nw.textContent = ch; s.el.appendChild(nw);
      if (reduce || !nw.animate) { s.el.removeChild(old); return; }
      nw.animate([{ transform: 'translateY(100%)' }, { transform: 'translateY(0)' }], o);
      old.animate([{ transform: 'translateY(0)' }, { transform: 'translateY(-100%)' }], o).onfinish = function () { if (old.parentNode) old.parentNode.removeChild(old); };
    }
    function setTime(str) {
      var i;
      if (slots.length !== str.length) build(str);
      else for (i = 0; i < str.length; i++) if (slots[i] && slots[i].v !== str.charAt(i)) roll(slots[i], str.charAt(i));
      ck.setAttribute('aria-label', str);
    }
    function tick() { var d = new Date(); setTime(tf.format(d)); cd.textContent = df.format(d); }
    tick(); setInterval(tick, 1000);
  })();

  (function () {
    var NS = 'http://www.w3.org/2000/svg', g = document.getElementById('anaDots'), i, a, c;
    var hh = document.getElementById('anaH'), hm = document.getElementById('anaM'), hs = document.getElementById('anaS');
    var reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    for (i = 0; i < 12; i++) {
      a = i * Math.PI / 6; c = document.createElementNS(NS, 'circle');
      c.setAttribute('cx', 50 + 38 * Math.sin(a)); c.setAttribute('cy', 50 - 38 * Math.cos(a));
      c.setAttribute('r', i % 3 ? 2.6 : 3.8); c.setAttribute('fill', 'hsl(' + ((i * 30 + 330) % 360) + ',95%,60%)');
      g.appendChild(c);
    }
    function rot(e, d) { e.setAttribute('transform', 'rotate(' + d + ' 50 50)'); }
    function frame() {
      var d = new Date(), s = d.getSeconds() + (reduce ? 0 : d.getMilliseconds() / 1000), m = d.getMinutes() + s / 60, h = d.getHours() % 12 + m / 60;
      rot(hh, h * 30); rot(hm, m * 6); rot(hs, s * 6);
      if (reduce) setTimeout(frame, 1000); else requestAnimationFrame(frame);
    }
    frame();
  })();

  (function () {
    var cv = document.getElementById('meter'), cx = cv.getContext('2d');
    var N = 160, M = 30, lv = [], pk = [], ph = [], k;
    var W = 0, H = 0, dpr = 1, act = 0, beat = 0, nextK = 0, tPrev = 0, lastD = 0;
    for (k = 0; k < N; k++) { lv[k] = 0; pk[k] = 0; ph[k] = 0; }

    function size() {
      var r = cv.getBoundingClientRect();
      dpr = window.devicePixelRatio || 1;
      W = Math.round(r.width); H = Math.round(r.height);
      if (W < 2 || H < 2) return;
      cv.width = Math.round(W * dpr); cv.height = Math.round(H * dpr);
    }
    function clamp(v) { return v < 0 ? 0 : (v > 1 ? 1 : v); }
    function hue(x) { return (330 + x * 300) % 360; }
    function band(a, i) {
      var s = Math.floor(i * N / M), e = Math.max(s + 1, Math.floor((i + 1) * N / M)), t = 0, j;
      for (j = s; j < e; j++) t += a[j];
      return t / (e - s);
    }
    function rr(x, y, w, h, r) {
      r = Math.max(0, Math.min(r, w / 2, h / 2));
      cx.beginPath(); cx.moveTo(x + r, y); cx.arcTo(x + w, y, x + w, y + h, r); cx.arcTo(x + w, y + h, x, y + h, r);
      cx.arcTo(x, y + h, x, y, r); cx.arcTo(x, y, x + w, y, r); cx.closePath();
    }

    function step(t) {
      var dt = Math.min(0.1, t - tPrev), x, a, b, v, tg, up, dn, playing, buf, i;
      tPrev = t; if (dt <= 0) return;
      playing = wantPlay && !au.paused && nowSt.className === 'on';
      buf = wantPlay && nowSt.className === 'buf';
      tg = playing ? 1 : (buf ? 0.1 : 0);
      act += (tg - act) * (1 - Math.pow(0.92, dt * 60));
      if (t >= nextK) { beat = 1; nextK = t + 0.44 + Math.random() * 0.1; }
      beat *= Math.pow(0.86, dt * 60);
      up = 1 - Math.pow(0.45, dt * 60); dn = 1 - Math.pow(0.9, dt * 60);
      for (i = 0; i < N; i++) {
        x = i / (N - 1);
        a = 0.5 + 0.5 * Math.sin(t * (1.7 + i * 0.37 * 32 / N) + i * 1.3);
        b = 0.5 + 0.5 * Math.sin(t * (3.1 + i * 0.21 * 32 / N) + i * 0.7);
        v = (1 - 0.45 * x) * (0.3 + 0.5 * a * b + 0.35 * Math.random()) + beat * (1 - x) * 0.5;
        v = clamp(v * act * 1.35);
        lv[i] += (v - lv[i]) * (v > lv[i] ? up : dn);
        if (lv[i] >= pk[i]) { pk[i] = lv[i]; ph[i] = 0.35; }
        else if (ph[i] > 0) ph[i] -= dt;
        else pk[i] = Math.max(lv[i], pk[i] - dt * 0.8);
      }
    }

    function draw() {
      var p = Math.round(Math.min(6, H * 0.14)), x0 = p, y0 = p, w = W - 2 * p, h = H - 2 * p, g = 2, bw, i, bh;
      M = Math.max(24, Math.min(N, Math.round((w + g) / 10))); bw = (w - (M - 1) * g) / M;
      cx.setTransform(dpr, 0, 0, dpr, 0, 0); cx.clearRect(0, 0, W, H);
      cx.fillStyle = 'rgba(0,0,0,.4)'; cx.fillRect(0, 0, W, H);
      for (i = 0; i < M; i++) {
        bh = Math.max(1.5, band(lv, i) * h);
        cx.fillStyle = 'hsl(' + hue(i / (M - 1)) + ',100%,60%)';
        rr(x0 + i * (bw + g), y0 + h - bh, bw, bh, 1.5); cx.fill();
        cx.fillStyle = 'rgba(255,255,255,.9)';
        cx.fillRect(x0 + i * (bw + g), y0 + h - Math.max(2, band(pk, i) * h) - 1.5, bw, 1.5);
      }
    }
    function loop(ts) {
      requestAnimationFrame(loop);
      if (cv.offsetWidth < 2 || ts - lastD < 33) return;
      lastD = ts;
      if (!W || Math.round(cv.getBoundingClientRect().width) !== W) size();
      step(ts / 1000); draw();
    }
    window.addEventListener('resize', size);
    size();
    requestAnimationFrame(loop);
  })();
</script>
